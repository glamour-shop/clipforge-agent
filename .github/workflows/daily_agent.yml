name: ClipForge Autonomous Daily Shorts Agent

on:
  schedule:
    # Runs automatically twice daily at 14:00 UTC and 20:00 UTC
    - cron: '0 14,20 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Category or Specific Command (e.g. football, cricket, youtubers, streamers, gaming, FIFA, GTA)'
        required: false
        default: ''

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure YouTube Account Credentials (if provided in Repository Secrets)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          OWN_CHANNEL_ID: ${{ secrets.OWN_CHANNEL_ID }}
        run: |
          python -c "
          import os, database
          database.init_db()
          if os.getenv('YOUTUBE_API_KEY'):
              database.set_setting('YOUTUBE_API_KEY', os.getenv('YOUTUBE_API_KEY'))
          if os.getenv('OWN_CHANNEL_ID'):
              database.set_setting('OWN_CHANNEL_ID', os.getenv('OWN_CHANNEL_ID'))
          if os.getenv('YT_ACCESS_TOKEN') or os.getenv('YT_REFRESH_TOKEN'):
              database.save_social_account(
                  platform='youtube',
                  account_name='Connected YouTube Channel',
                  account_handle='@youtube',
                  api_key=os.getenv('YOUTUBE_API_KEY', ''),
                  access_token=os.getenv('YT_ACCESS_TOKEN', ''),
                  refresh_token=os.getenv('YT_REFRESH_TOKEN', ''),
                  client_id=os.getenv('GOOGLE_CLIENT_ID', ''),
                  client_secret=os.getenv('GOOGLE_CLIENT_SECRET', ''),
                  channel_id=os.getenv('OWN_CHANNEL_ID', '')
              )
          "

      - name: Execute Autonomous Daily Shorts Agent Cycle
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.category }}" ]; then
            python agent.py --category "${{ github.event.inputs.category }}"
          else
            python agent.py
          fi
